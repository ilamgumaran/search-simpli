name: search_simpli
description: >
  Dart FFI bindings for Search Simpli's C ABI (ss_*) hybrid search engine —
  open a published snapshot, query it, and read cited evidence, from Dart
  or Flutter, with no daemon process.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  ffi: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  ffigen: ^17.0.0
  lints: ^5.0.0
  test: ^1.25.0
