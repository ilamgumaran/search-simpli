# ffigen config (docs/tasks/S1-T2.md criterion 1): generates
# lib/src/bindings_generated.dart from the single C header that is the
# engine's contract (zig/include/search_simpli.h, ADR 0002 / S1-T0).
#
# Run with: dart run ffigen --config ffigen.yaml
#
# Regenerate whenever ../../../zig/include/search_simpli.h changes; nothing
# here should need hand editing afterward (SearchSimpli in
# lib/src/search_simpli_base.dart wraps the generated bindings and is not
# touched by ffigen).
# llvm-path: this Mac has no Homebrew-installed LLVM; libclang.dylib comes
# from Xcode's Command Line Tools instead (`xcode-select -p`). Adjust or add
# entries here on a machine that keeps libclang elsewhere (ffigen searches
# each of these in order).
llvm-path:
  - "/Library/Developer/CommandLineTools/usr"
name: SearchSimpliBindings
description: >
  Generated FFI bindings for search_simpli.h (Search Simpli's C ABI). Do not
  edit by hand; see ffigen.yaml.
output: "lib/src/bindings_generated.dart"
headers:
  entry-points:
    - "../../../zig/include/search_simpli.h"
  include-directives:
    - "../../../zig/include/search_simpli.h"
comments:
  style: any
  length: full
preamble: |
  // Generated by `dart run ffigen --config ffigen.yaml`. Do not edit by hand.
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names
functions:
  include:
    - "ss_.*"
structs:
  include:
    - "ss_handle"
macros:
  include:
    - "SS_ERR_.*"
