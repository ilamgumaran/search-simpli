name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate requirements register
        run: python3 scripts/check_requirements.py

      - name: Python behavioral tests (dependency-free base)
        env:
          # This runner has no Zig on purpose; tests/test_cli_process.py skips only on this flag.
          SEARCH_SIMPLI_NO_ZIG: "1"
        run: python3 -m unittest discover -s tests -v

      # Strict 1.0 is a mechanical fixture invariant, not a production relevance target.
      - name: Dependency-free relevance mechanics invariant
        run: >-
          python3 relevance_smoke.py
          fixtures/relevance-smoke/corpus
          fixtures/relevance-smoke/judgments.json
          --mode lexical --top-k 10
          --min-ndcg 1 --min-mrr 1 --min-recall 1 --min-success 1

      - name: No trailing whitespace in docs/scripts
        run: |
          if git grep -nP ' +$' -- '*.md' '*.py' ; then
            echo "Trailing whitespace found (see above)."; exit 1
          fi
          echo "No trailing whitespace."

  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-x86_64-linux-0.16.0.tar.xz"
          archive_url="https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          expected_sha256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

          curl --fail --show-error --location --silent \
            --connect-timeout 20 --max-time 180 \
            --retry 3 --retry-delay 2 --retry-max-time 240 \
            "$archive_url" --output "$archive"

          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --status
          tar -xf "$archive" -C "$RUNNER_TEMP"
          zig_dir="$RUNNER_TEMP/zig-x86_64-linux-0.16.0"
          test -x "$zig_dir/zig"
          test "$("$zig_dir/zig" version)" = "0.16.0"
          echo "$zig_dir" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"

      - name: Zig engine tests
        working-directory: zig
        run: zig build test -j2 --summary all

      - name: Zig C ABI tests
        working-directory: zig
        run: zig build test-abi -j2 --summary all

      - name: Python behavioral tests with native CLI
        run: >-
          env -u SEARCH_SIMPLI_LIBRARY_PATH
          -u SEARCH_SIMPLI_NO_ZIG
          -u SEARCHD_BINARY
          python3 -m unittest discover -s tests -v
