name: checks

on:
  pull_request:
  push:
    # S5-T6 ruling 6: a task branch is checked before it merges.
    branches: [main, "task/**"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate requirements register
        run: python3 scripts/check_requirements.py

      - name: Python behavioral tests (dependency-free base)
        env:
          # This runner has no Zig on purpose; tests/test_cli_process.py skips only on this flag.
          SEARCH_SIMPLI_NO_ZIG: "1"
        run: python3 -m unittest discover -s tests -v

      # Strict 1.0 is a mechanical fixture invariant, not a production relevance target.
      - name: Dependency-free relevance mechanics invariant
        run: >-
          python3 relevance_smoke.py
          fixtures/relevance-smoke/corpus
          fixtures/relevance-smoke/judgments.json
          --mode lexical --top-k 10
          --min-ndcg 1 --min-mrr 1 --min-recall 1 --min-success 1

      # S3-T7: the frozen family-folder judgments through the Python reference; cases
      # it cannot answer yet are skipped with a count.
      - name: Family-folder judgment pack
        run: python3 scripts/relevance_smoke.py --pack family-folder

      # S5-T1: J2, the judged fixture, through the Python reference and the gate
      # against the committed baseline (fixtures/j2/baseline.json).
      - name: J2 judged pack (Python reference) through the gate
        env:
          PYTHONHASHSEED: "0"
        run: |
          python3 scripts/relevance_smoke.py --pack j2 --output "$RUNNER_TEMP/j2.json"
          python3 scripts/j2_gate.py "$RUNNER_TEMP/j2.json"

      - name: No trailing whitespace in docs/scripts
        run: |
          if git grep -nP ' +$' -- '*.md' '*.py' ; then
            echo "Trailing whitespace found (see above)."; exit 1
          fi
          echo "No trailing whitespace."

  # S5-T6 (review R01): the analyzer's tables and every golden the Python reference
  # writes are generated with Unicode 13.0.0, so their regeneration checks skip on
  # the 3.11 jobs above (Unicode 14.0.0). Here they run on Python 3.9 (Unicode
  # 13.0.0), counted by name: a skip, a missing check or a stale file fails the job,
  # and each failure is a workflow annotation naming the file.
  unicode-13-goldens:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9 (Unicode 13.0.0)
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: The interpreter's Unicode is the tables' (13.0.0)
        run: python3 scripts/ci_unicode_goldens.py --check-version

      # No generator needs Zig today (tests/test_goldens_fresh.py marks each); it is
      # installed as native-linux installs it so one marked as needing it runs here.
      - name: Install pinned Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-x86_64-linux-0.16.0.tar.xz"
          archive_url="https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          expected_sha256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

          curl --fail --show-error --location --silent \
            --connect-timeout 20 --max-time 180 \
            --retry 3 --retry-delay 2 --retry-max-time 240 \
            "$archive_url" --output "$archive"

          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --status
          tar -xf "$archive" -C "$RUNNER_TEMP"
          zig_dir="$RUNNER_TEMP/zig-x86_64-linux-0.16.0"
          test -x "$zig_dir/zig"
          test "$("$zig_dir/zig" version)" = "0.16.0"
          echo "$zig_dir" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"

      - name: Golden and Unicode table regeneration (no skips allowed)
        run: >-
          env -u SEARCH_SIMPLI_LIBRARY_PATH -u SEARCH_SIMPLI_NO_ZIG
          python3 scripts/ci_unicode_goldens.py

  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-x86_64-linux-0.16.0.tar.xz"
          archive_url="https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          expected_sha256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

          curl --fail --show-error --location --silent \
            --connect-timeout 20 --max-time 180 \
            --retry 3 --retry-delay 2 --retry-max-time 240 \
            "$archive_url" --output "$archive"

          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --status
          tar -xf "$archive" -C "$RUNNER_TEMP"
          zig_dir="$RUNNER_TEMP/zig-x86_64-linux-0.16.0"
          test -x "$zig_dir/zig"
          test "$("$zig_dir/zig" version)" = "0.16.0"
          echo "$zig_dir" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"

      - name: Zig engine tests
        working-directory: zig
        run: zig build test -j2 --summary all

      - name: Filename query access and scratch complexity (no skips)
        working-directory: zig
        shell: bash
        run: |
          set -euo pipefail
          for guard_mode in Debug ReleaseSmall; do
            zig test -O"$guard_mode" -lc src/filename_complexity_test.zig --test-filter 'filename query complexity' 2>&1 | tee "$RUNNER_TEMP/filename-complexity-$guard_mode.log"
            grep -Fq 'All 2 tests passed.' "$RUNNER_TEMP/filename-complexity-$guard_mode.log"
          done

      - name: Zig C ABI tests
        working-directory: zig
        run: zig build test-abi -j2 --summary all

      - name: Python behavioral tests with native CLI
        run: >-
          env -u SEARCH_SIMPLI_LIBRARY_PATH
          -u SEARCH_SIMPLI_NO_ZIG
          -u SEARCHD_BINARY
          python3 -m unittest discover -s tests -v

      # S3-T8: the tests that skip in the Zig-less job above run here by name, so
      # a skip would fail the job: CLI/RPC surface parity, the MCP conformance
      # client and its plants, the folder-knowledge CLI process tests.
      - name: Folder-knowledge surfaces and MCP (no skips allowed)
        shell: bash
        run: |
          set -euo pipefail
          env -u SEARCH_SIMPLI_LIBRARY_PATH -u SEARCH_SIMPLI_NO_ZIG -u SEARCHD_BINARY \
            python3 -m unittest -v tests.test_mcp tests.test_folder_surfaces tests.test_cli_process 2>&1 | tee "$RUNNER_TEMP/surfaces.log"
          if grep -Eq '(skipped|OK \(skipped)' "$RUNNER_TEMP/surfaces.log"; then
            echo "A surface or MCP test was skipped in the Zig job."; exit 1
          fi

  # S4-T6: the release build a phone and a release `searchd` run. A read after
  # `apply_changes` crashed `searchd serve` only in release builds (a stale
  # allocator across the reload) while every Debug job above stayed green, so
  # the engine tests, the C ABI harness and the Python suites also run against
  # a ReleaseSmall build.
  native-linux-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-x86_64-linux-0.16.0.tar.xz"
          archive_url="https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          expected_sha256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

          curl --fail --show-error --location --silent \
            --connect-timeout 20 --max-time 180 \
            --retry 3 --retry-delay 2 --retry-max-time 240 \
            "$archive_url" --output "$archive"

          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --status
          tar -xf "$archive" -C "$RUNNER_TEMP"
          zig_dir="$RUNNER_TEMP/zig-x86_64-linux-0.16.0"
          test -x "$zig_dir/zig"
          test "$("$zig_dir/zig" version)" = "0.16.0"
          echo "$zig_dir" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"

      - name: Zig engine tests (ReleaseSmall)
        working-directory: zig
        run: zig build test -Doptimize=ReleaseSmall -j2 --summary all

      - name: Zig C ABI tests (ReleaseSmall)
        working-directory: zig
        run: zig build test-abi -Doptimize=ReleaseSmall -j2 --summary all

      - name: Build searchd (ReleaseSmall)
        working-directory: zig
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseSmall -j2 --prefix "$RUNNER_TEMP/release"
          test -x "$RUNNER_TEMP/release/bin/searchd"

      # The suites find the binary through SEARCHD_BINARY (tests/test_folder_surfaces.py
      # build_searchd, tests/test_cli_process.py); without it they build a Debug one.
      - name: Python behavioral tests against the ReleaseSmall searchd
        shell: bash
        run: |
          set -euo pipefail
          env -u SEARCH_SIMPLI_LIBRARY_PATH -u SEARCH_SIMPLI_NO_ZIG \
            SEARCHD_BINARY="$RUNNER_TEMP/release/bin/searchd" \
            python3 -m unittest discover -s tests -v

      - name: Folder surfaces, tool schemas and MCP against the ReleaseSmall searchd (no skips allowed)
        shell: bash
        run: |
          set -euo pipefail
          env -u SEARCH_SIMPLI_LIBRARY_PATH -u SEARCH_SIMPLI_NO_ZIG \
            SEARCHD_BINARY="$RUNNER_TEMP/release/bin/searchd" \
            python3 -m unittest -v tests.test_folder_surfaces tests.test_tool_schemas tests.test_mcp 2>&1 | tee "$RUNNER_TEMP/release-surfaces.log"
          if grep -Eq '(skipped|OK \(skipped)' "$RUNNER_TEMP/release-surfaces.log"; then
            echo "A surface, schema or MCP test was skipped against the release searchd."; exit 1
          fi
